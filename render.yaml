services:
  - type: web
    name: nanobanana-erp
    env: java
    region: frankfurt
    plan: free
    branch: main
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/erp-1.0.0.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: nanobanana-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: nanobanana-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: nanobanana-db
          property: password
    healthCheckPath: /login
    autoDeploy: true

  - type: pserv
    name: nanobanana-db
    plan: free
    database:
      name: nanobanana
      ipAllowList: []
