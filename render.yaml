services:
  - type: web
    name: nanobanana-erp
    env: java
    region: frankfurt
    plan: free
    branch: main
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/erp-1.0.0.jar
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: nanobanana-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nanobanana-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nanobanana-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: nanobanana-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: nanobanana-db
          property: password
      - key: ADMIN_EMAIL
        value: admin@nanobanana.co.mz
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"

  - type: pserv
    name: nanobanana-db
    plan: free
    database:
      name: nanobanana
      ipAllowList: []
