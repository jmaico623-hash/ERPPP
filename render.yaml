services:
  # Build do Dockerfile e deploy automático quando os checks do GitHub passam
  - type: web
    runtime: docker
    name: nanobanana-erp
    region: frankfurt
    plan: 1c-2g # Sem hibernação: app responde rápido e não trava em produção
    branch: master
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass # Push na master só publica com CI verde
    maxShutdownDelaySeconds: 60
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: nanobanana-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nanobanana-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nanobanana-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: nanobanana-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: nanobanana-db
          property: password
      - key: ADMIN_EMAIL
        value: admin@nanobanana.co.mz
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: APP_SUBSCRIPTION_PRICE
        value: "350.00"
      - key: MAX_DESCONTO_VENDEDOR_PERCENT
        value: "10"
      - key: APP_MPESA_NUMBER
        value: "856810532"
      - key: APP_EMOLA_NUMBER
        value: "863237473"
      - key: APP_WHATSAPP_NUMBER
        value: "863237473"

databases:
  # PostgreSQL pago: sem expiração automática como no plano gratuito
  - name: nanobanana-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: nanobanana
    diskSizeGB: 10
    ipAllowList: [] # Só a aplicação na rede privada do Render acessa o banco
