# ============================================================
# NanoBanana ERP - Configuracao
# ============================================================
spring.application.name=nanobanana-erp

# ------------------------------------------------------------
# PERFIL PADRAO / DESENVOLVIMENTO (H2 - local)
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/nanobanana
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console desabilitado por padrão (habilitado apenas no perfil 'dev')
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
# PERFIL DE PRODUCAO (PostgreSQL - Render/Railway)
# Ativado com: SPRING_PROFILES_ACTIVE=prod
# ------------------------------------------------------------
---
spring.config.activate.on-profile: prod
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

# ------------------------------------------------------------
# PERFIL DE DESENVOLVIMENTO AVANÇADO (H2 Console ativo)
# Ativado com: SPRING_PROFILES_ACTIVE=dev
# ------------------------------------------------------------
---
spring.config.activate.on-profile: dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=false

# ------------------------------------------------------------
# CONFIGURACOES GERAIS (todos os perfis)
# ------------------------------------------------------------
# ddl-auto=validate: o Hibernate so VALIDA o schema, nao altera.
# O schema e gerenciado pelo Flyway (migrations em db/migration/)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway - controle de versao do banco de dados
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Server
server.port=${PORT:8080}

# CSRF protegido por Spring Security
spring.mvc.hiddenmethod.filter.enabled=true

# Sessões seguras
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Strict

# ------------------------------------------------------------
# ACTUATOR - Health checks, métricas (produção)
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.defaults.enabled=true

# Info personalizada
management.info.env.enabled=true
management.info.git.enabled=true
management.info.build.enabled=true

# Métricas Prometheus (opcional)
# management.endpoints.web.exposure.include=health,info,metrics,prometheus
# management.prometheus.metrics.export.enabled=true
