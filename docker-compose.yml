services:
  postgres:
    image: postgres:16-alpine
    container_name: nanobanana-db
    environment:
      POSTGRES_DB: ${DB_NAME:-nanobanana}
      POSTGRES_USER: ${DB_USER:-nano}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nano} -d ${DB_NAME:-nanobanana}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nanobanana-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanobanana-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nanobanana}
      DB_USER: ${DB_USER:-nano}
      DB_PASS: ${DB_PASS:?Defina DB_PASS no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nanobanana.co.mz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - nanobanana-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nanobanana-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nanobanana.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defina PGADMIN_PASSWORD no arquivo .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - nanobanana-network
    profiles:
      - tools

volumes:
  pgdata:
  pgadmin-data:

networks:
  nanobanana-network:
    driver: bridge
