# ============================================================
# Perfil PROD - PostgreSQL gerenciado por variáveis de ambiente
#
# Variáveis esperadas:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
#   ADMIN_EMAIL, ADMIN_PASSWORD
#   SESSION_COOKIE_SECURE (default: true)
# ============================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nanobanana}
spring.datasource.username=${DB_USER:nanobanana}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# Schema versionado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Console H2 nunca em produção
spring.h2.console.enabled=false

# Nunca criar dados demo em produção
app.seed.enabled=false

# Cookies exigem HTTPS em produção
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Logs
logging.level.root=INFO
logging.level.com.nanobanana=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# Cache de templates
spring.thymeleaf.cache=true
