# ============================================================
# NanoBanana ERP - Configuração base (comum a todos os perfis)
# Perfis disponíveis: dev (padrão), prod, test
# ============================================================

spring.application.name=NanoBanana ERP
spring.profiles.default=dev

# Servidor
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Sessão / cookies
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Flyway (schema versionado)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator (somente health/info expostos)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true

# Informações da aplicação
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=ERP por assinatura para pequenos negócios

# ============================================================
# Configuração da aplicação (NanoBanana)
# ============================================================

# Seed de dados demo (APENAS desenvolvimento)
app.seed.enabled=false

# Super admin. Em produção defina ADMIN_PASSWORD no ambiente.
app.admin.email=${ADMIN_EMAIL:admin@nanobanana.co.mz}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nome=${ADMIN_NOME:Super Admin}

# Limite de tentativas de login antes de bloquear a conta
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
