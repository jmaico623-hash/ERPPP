<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Alertas - NanoBanana ERP')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/shell :: sidebar('alertas')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/shell :: topbar('Alertas')}"></header>

        <main class="dash-content">
            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-bell"></i> Operação</span>
                    <h1>Alertas do sistema</h1>
                    <p>Deteção automática de anomalias e desvios.</p>
                </div>
            </div>

            <div class="card" th:each="alerta : ${alertas}">
                <div class="card-head mb-0">
                    <div>
                        <h2>
                            <i class="fas fa-triangle-exclamation"></i>
                            <span th:text="${alerta.tipo}">Tipo</span>
                            <span th:if="${alerta.severidade.name() == 'CRITICA'}" class="badge badge-danger">Crítico</span>
                            <span th:if="${alerta.severidade.name() == 'ALTA'}" class="badge badge-warning">Alto</span>
                            <span th:if="${alerta.severidade.name() == 'MEDIA'}" class="badge badge-info">Médio</span>
                            <span th:if="${alerta.severidade.name() == 'BAIXA'}" class="badge badge-success">Baixo</span>
                        </h2>
                        <p class="muted" th:text="${alerta.descricao}">Descrição</p>
                        <p class="muted" th:text="${#temporals.format(alerta.criadoEm, 'dd/MM/yyyy HH:mm')}">-</p>
                    </div>
                    <div>
                        <form th:if="${!alerta.resolvido}" th:action="@{'/alertas/' + ${alerta.id} + '/resolver'}" method="POST" class="mb-0">
                            <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-check"></i> Resolver</button>
                        </form>
                        <span th:if="${alerta.resolvido}" class="badge badge-success"><i class="fas fa-check"></i> Resolvido</span>
                    </div>
                </div>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(alertas)}">
                <i class="fas fa-circle-check"></i>
                <strong>Sem alertas</strong>
                Está tudo sob controlo.
            </div>
        </main>
    </div>
</div>
</body>
</html>
