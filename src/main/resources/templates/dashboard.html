<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NanoBanana ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/theme.css">
    <script defer src="/js/theme.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-leaf"></i> NanoBanana ERP</div>
        <div class="user-info">
            <span class="badge-plano" th:text="${session.plano}">TESTE</span>
            <span class="merchant-name" th:text="${session.clienteNegocio}"></span>
            <span class="client-name" th:text="${session.clienteNome}"></span>
            <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </nav>
    <div class="main-container">
        <aside class="sidebar">
            <ul>
                <li class="active"><a href="/dashboard"><i class="fas fa-home"></i> Painel</a></li>
                <li><a href="/vendas"><i class="fas fa-cart-plus"></i> Vender (PDV)</a></li>
                <li><a href="/fiados"><i class="fas fa-book-open"></i> Fiado</a></li>
                <li><a href="/inventario"><i class="fas fa-boxes"></i> Inventário</a></li>
                <li><a href="/estagnados"><i class="fas fa-hourglass-end"></i> Estagnados</a></li>
                <li><a href="/assinatura"><i class="fas fa-id-card"></i> Assinatura</a></li>
            </ul>
        </aside>
        <main class="content">
            <h1>📊 Resumo do Negócio</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3><i class="fas fa-money-bill-wave"></i> Vendas Hoje</h3>
                    <p class="stat-value" th:text="${#numbers.formatDecimal(vendasHoje, 1, 2)} + ' MZN'">0 MZN</p>
                </div>
                <div class="stat-card warning">
                    <h3><i class="fas fa-book"></i> Total em Fiado</h3>
                    <p class="stat-value" th:text="${#numbers.formatDecimal(totalFiado, 1, 2)} + ' MZN'">0 MZN</p>
                </div>
                <div class="stat-card">
                    <h3><i class="fas fa-warehouse"></i> Valor em Stock</h3>
                    <p class="stat-value" th:text="${#numbers.formatDecimal(valorStock, 1, 2)} + ' MZN'">0 MZN</p>
                </div>
                <div class="stat-card danger">
                    <h3><i class="fas fa-hourglass-end"></i> Produtos Estagnados</h3>
                    <p class="stat-value" th:text="${estagnadosCount}">0</p>
                </div>
            </div>
            <div class="assinatura-info">
                <i class="fas fa-clock"></i> Assinatura: <strong th:text="${session.plano}"></strong>
            </div>
        </main>
    </div>
</body>
</html>
