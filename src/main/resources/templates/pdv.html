<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - NanoBanana ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style th:inline="css">
        /* Reset local: o PDV não carrega o style.css global (que tem o reset) */
        html { height: 100%; }
        body.pdv-page {
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        body.pdv-page *, body.pdv-page *::before, body.pdv-page *::after { box-sizing: border-box; }
        body.pdv-page h2, body.pdv-page p { margin: 0; }
        body.pdv-page button, body.pdv-page input, body.pdv-page select, body.pdv-page textarea { font-family: inherit; }

        .pdv-page .main-content { padding-top: 0; }
        .pdv-page .page-content { padding: 0; max-width: none; }
        .pdv-page .navbar, .pdv-page .sidebar, .pdv-page .footer { display: none !important; }
        
        .pdv-layout { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
        
        .products-panel {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            padding: clamp(12px, 1.6vw, 24px);
            overflow-y: auto;
            background: var(--bg);
        }
        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .panel-title { font-size: 18px; font-weight: 600; color: var(--text); }
        .panel-title i { color: var(--primary); margin-right: 8px; }
        .search-box { position: relative; max-width: 400px; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 18px; }
        .search-box input { width: 100%; padding: 14px 16px 14px 48px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 15px; color: var(--text); background: var(--card-bg); transition: var(--transition); }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .product-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 16px; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; }
        .product-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .product-card.out-of-stock { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .product-card .name { font-weight: 600; color: var(--text); margin-bottom: 8px; font-size: 14px; line-height: 1.3; }
        .product-card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-light); }
        .product-card .price { font-size: 18px; font-weight: 700; color: var(--primary); }
        .product-card .stock { font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .product-card .stock.low { color: var(--warning); }
        .product-card .stock.out { color: var(--danger); }
        .product-card .stock i { font-size: 10px; }
        
        .cart-panel {
            width: clamp(320px, 28vw, 400px);
            max-width: 42vw;
            flex: 0 0 auto;
            min-height: 0;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .cart-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 10px; }
        .cart-header i { color: var(--primary); }
        .cart-items { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px; }
        .cart-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .cart-empty i { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
        .cart-empty p { margin: 4px 0; }
        .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border-light); animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        .cart-item .info { flex: 1; min-width: 0; }
        .cart-item .info .name { font-weight: 500; color: var(--text); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cart-item .info .price { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .cart-item .qty-control { display: flex; align-items: center; gap: 8px; }
        .cart-item .qty-control button { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--card-bg); border-radius: var(--radius); font-size: 14px; color: var(--text); display: flex; align-items: center; justify-content: center; transition: var(--transition-fast); }
        .cart-item .qty-control button:hover { background: var(--bg); border-color: var(--primary); color: var(--primary); }
        .cart-item .qty-control button:disabled { opacity: 0.5; cursor: not-allowed; }
        .cart-item .qty-control span { min-width: 28px; text-align: center; font-weight: 600; font-size: 14px; }
        .cart-item .subtotal { font-weight: 700; color: var(--primary); min-width: 80px; text-align: right; font-size: 14px; }
        .cart-item .remove { color: var(--danger); padding: 8px; border-radius: var(--radius); transition: var(--transition-fast); opacity: 0.6; }
        .cart-item .remove:hover { opacity: 1; background: var(--danger-light); }
        
        .cart-footer { flex: 0 0 auto; padding: 14px 16px; border-top: 1px solid var(--border); background: var(--bg); }
        .cart-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .cart-total .label { color: var(--text-muted); font-size: 13px; font-weight: 500; }
        .cart-total .amount { color: var(--primary); font-size: 22px; }
        
        .checkout-form { display: flex; flex-direction: column; gap: 8px; }
        .checkout-form select, .checkout-form input { width: 100%; padding: 10px 12px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 14px; color: var(--text); background: var(--card-bg); transition: var(--transition); }
        .checkout-row { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 8px; }
        .checkout-row select, .checkout-row input { min-width: 0; }
        .checkout-form select:focus, .checkout-form input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .checkout-form select { cursor: pointer; }
        
        .fiado-fields { display: none; flex-direction: column; gap: 10px; animation: slideDown 0.2s ease; }
        .fiado-fields.open { display: flex; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        
        .troco-calculator { background: var(--success-light); border: 2px solid var(--primary); border-radius: var(--radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 8px; animation: slideDown 0.2s ease; }
        .troco-calculator.hidden { display: none; }
        .troco-calculator label { font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .troco-calculator .valor-pago-input { padding: 10px 12px; border: 2px solid var(--primary); border-radius: var(--radius); font-size: 20px; font-weight: 700; color: var(--primary-dark); text-align: right; }
        .troco-calculator .valor-pago-input:focus { outline: none; box-shadow: 0 0 0 3px var(--primary-light); }
        .notas-rapidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .btn-nota { padding: 8px 6px; background: var(--card-bg); border: 2px solid var(--primary); border-radius: var(--radius); font-size: 11px; font-weight: 700; color: var(--primary); cursor: pointer; transition: var(--transition-fast); text-align: center; }
        .btn-nota:hover { background: var(--primary); color: white; transform: translateY(-1px); }
        .btn-nota.active { background: var(--primary); color: white; }
        .troco-display { text-align: center; padding: 10px; border-radius: var(--radius); font-size: 16px; font-weight: 700; transition: var(--transition); }
        .troco-display.empty { background: var(--border-light); color: var(--text-light); border: 2px solid var(--border); }
        .troco-display.ok { background: var(--success-light); color: var(--primary-dark); border: 2px solid var(--primary); }
        .troco-display.exact { background: var(--warning-light); color: var(--warning); border: 2px solid var(--warning); }
        .troco-display.insufficient { background: var(--danger-light); color: var(--danger); border: 2px solid var(--danger); }
        
        .btn-checkout { padding: 12px 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-checkout:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-checkout:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; transform: none; box-shadow: none; }
        
        /* Ecrãs muito grandes: aproveita o espaço */
        @media (min-width: 1600px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }

        /* Portáteis/tablets: carrinho mais estreito e grelha mais densa */
        @media (max-width: 1200px) {
            .cart-panel { width: clamp(300px, 32vw, 360px); max-width: 44vw; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .product-card { padding: 12px; }
            .product-card .price { font-size: 16px; }
        }

        /* Tablets em retrato: mantém 2 colunas para não obrigar a fazer scroll à página */
        @media (max-width: 900px) and (min-width: 701px) {
            .cart-panel { width: 300px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .panel-header { flex-direction: column; align-items: stretch; gap: 8px; }
            .search-box { max-width: none; }
        }

        /* Ecrãs com pouca altura (portáteis pequenos/tablets deitados): compacta o rodapé */
        @media (max-height: 780px) {
            .cart-header { padding: 10px 14px; }
            .cart-footer { padding: 10px 14px; }
            .cart-total { margin-bottom: 8px; }
            .cart-total .amount { font-size: 20px; }
            .checkout-form { gap: 6px; }
            .checkout-row { gap: 6px; }
            .checkout-form select, .checkout-form input { padding: 8px 10px; }
            .troco-calculator { padding: 8px; gap: 6px; }
            .troco-calculator .valor-pago-input { padding: 8px 10px; font-size: 18px; }
            .btn-nota { padding: 6px 4px; }
            .troco-display { padding: 8px; font-size: 15px; }
            .btn-checkout { padding: 10px 14px; }
        }

        @media (max-height: 640px) {
            .cart-header { display: none; }
            .cart-item { padding: 8px; }
            .cart-empty { padding: 16px 10px; }
            .cart-empty i { font-size: 28px; margin-bottom: 6px; }
            .troco-calculator label { display: none; }
            .troco-display { padding: 6px; font-size: 14px; }
        }

        /* Telemóveis: empilha as zonas; cada uma faz scroll interno (página sem scroll) */
        @media (max-width: 700px) {
            .pdv-layout { flex-direction: column; }
            .products-panel { flex: 0 1 36%; min-height: 90px; padding: 12px; }
            .panel-header { flex-direction: column; align-items: stretch; gap: 8px; margin-bottom: 10px; }
            .search-box { max-width: none; }
            .search-box input { padding: 10px 12px 10px 40px; font-size: 14px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 8px; }
            .product-card { padding: 10px; border-radius: var(--radius); }
            .product-card .price { font-size: 15px; }
            .cart-panel { width: 100%; max-width: none; height: auto; flex: 1 1 64%; border-left: none; border-top: 1px solid var(--border); }
            .cart-header { padding: 8px 12px; font-size: 14px; }
            .cart-items { padding: 8px; }
            .cart-item { padding: 8px; gap: 8px; }
            .cart-item .subtotal { min-width: 64px; font-size: 13px; }
            .cart-item .qty-control button { width: 28px; height: 28px; }
            .cart-footer { padding: 10px 12px; }
        }

        /* Telemóvel deitado: mantém lado a lado com rodapé compacto (cabe sem scroll) */
        @media (max-height: 480px) and (orientation: landscape) {
            .pdv-layout { flex-direction: row; }
            .products-panel { flex: 1 1 auto; }
            .cart-panel { width: 320px; max-width: 44vw; height: 100%; flex: 0 0 auto; border-left: 1px solid var(--border); border-top: none; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
            .product-card { padding: 8px; }
        }

        /* Ecrãs retrato muito baixos: deixa a página rolar em vez de cortar o rodapé */
        @media (max-height: 560px) and (orientation: portrait) and (max-width: 700px) {
            body.pdv-page { overflow: auto; }
            .pdv-layout { height: auto; min-height: 100vh; min-height: 100dvh; }
            .cart-panel { height: auto; }
        }
    </style>
    <link rel="stylesheet" href="/css/theme.css">
    <!-- main.js precisa ser carregado antes do script inline: fornece debounce() e showToast() -->
    <script src="/js/main.js"></script>
    <script defer src="/js/theme.js"></script>
</head>
<body class="pdv-page">

    <div class="pdv-layout">
        <div class="products-panel">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fas fa-boxes" aria-hidden="true"></i> Produtos</h2>
                <div class="search-box">
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <input type="search" id="searchInput" placeholder="Buscar produto por nome ou código de barras..." autocomplete="off" aria-label="Buscar produtos">
                </div>
            </div>

            <div class="products-grid" id="productsGrid">
                <div th:each="produto : ${produtos}" 
                     class="product-card" 
                     th:classappend="${produto.semStock()} ? ' out-of-stock' : ''"
                     th:data-id="${produto.id}"
                     th:data-nome="${produto.nome}"
                     th:data-preco="${produto.precoVenda}"
                     th:data-stock="${produto.stockAtual}"
                     th:data-codigo="${produto.codigoBarras}"
                     onclick="addToCart(this)"
                     role="button"
                     tabindex="0"
                     th:aria-label="'Adicionar ' + ${produto.nome} + ' ao carrinho. Preço: ' + ${produto.precoVenda} + ' MZN. Stock: ' + ${produto.stockAtual}">
                    <div class="name" th:text="${produto.nome}">Produto</div>
                    <div class="meta">
                        <span class="price" th:text="${produto.precoVenda} + ' MZN'">0 MZN</span>
                        <span class="stock" 
                            th:classappend="${produto.stockBaixo()} ? ' low' : (${produto.semStock()} ? ' out' : '')"
                            th:text="'Stock: ' + ${produto.stockAtual}">
                            <i class="fas fa-box" aria-hidden="true"></i> Stock: 0
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="cart-panel">
            <div class="cart-header">
                <i class="fas fa-shopping-cart" aria-hidden="true"></i> Carrinho
            </div>

            <div class="cart-items" id="cartItems">
                <div class="cart-empty" id="cartEmpty">
                    <i class="fas fa-shopping-basket" aria-hidden="true"></i>
                    <p>Carrinho vazio</p>
                    <p style="font-size: 13px;">Clique num produto para adicionar</p>
                </div>
            </div>

            <div class="cart-footer">
                <div class="cart-total">
                    <span class="label">Total:</span>
                    <span class="amount" id="totalAmount">0,00 MZN</span>
                </div>
                <form method="POST" action="/pdv/finalizar" class="checkout-form" id="checkoutForm">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <input type="hidden" name="checkoutToken" th:value="${checkoutToken}">
                    <input type="hidden" name="itensJson" id="itensJson">
                    <div class="checkout-row">
                        <select name="metodoPagamento" id="metodoPagamento" required aria-label="Método de pagamento">
                            <option value="CASH">💵 Cash</option>
                            <option value="MPESA">📱 M-Pesa</option>
                            <option value="EMOLA">📱 e-Mola</option>
                            <option value="CARTAO">💳 Cartão</option>
                            <option value="FIADO">📒 Fiado</option>
                        </select>
                        <input type="number" name="desconto" id="desconto" placeholder="Desconto (MZN)" step="0.01" min="0" value="0" aria-label="Desconto" oninput="onDescontoChange()">
                    </div>
                    <div id="fiadoFields" class="fiado-fields" aria-label="Dados do cliente para fiado">
                        <input type="text" name="nomeClienteFiado" placeholder="Nome do cliente" aria-label="Nome do cliente">
                        <input type="tel" name="telefoneClienteFiado" placeholder="Telefone" aria-label="Telefone do cliente">
                    </div>

                    <div id="trocoField" class="troco-calculator hidden" aria-label="Calculador de troco">
                        <label><i class="fas fa-calculator" aria-hidden="true"></i> Calculador de Troco</label>
                        <input type="number" name="valorPago" id="valorPago" class="valor-pago-input" placeholder="0,00" step="0.01" min="0" aria-label="Valor pago pelo cliente" oninput="calcularTroco()">
                        <div class="notas-rapidas">
                            <button type="button" class="btn-nota" onclick="setValorPago(50, this)" aria-label="Adicionar 50 MZN">50 MZN</button>
                            <button type="button" class="btn-nota" onclick="setValorPago(100, this)" aria-label="Adicionar 100 MZN">100 MZN</button>
                            <button type="button" class="btn-nota" onclick="setValorPago(200, this)" aria-label="Adicionar 200 MZN">200 MZN</button>
                            <button type="button" class="btn-nota" onclick="setValorPago(500, this)" aria-label="Adicionar 500 MZN">500 MZN</button>
                            <button type="button" class="btn-nota" onclick="setValorPago(1000, this)" aria-label="Adicionar 1000 MZN">1000 MZN</button>
                            <button type="button" class="btn-nota" onclick="setValorExato(this)" aria-label="Valor exato" style="border-color:var(--warning); color:var(--warning);">💡 Exato</button>
                        </div>
                        <div class="troco-display empty" id="trocoDisplay" aria-live="polite">Insira o valor pago</div>
                    </div>

                    <button type="submit" class="btn-checkout" id="btnCheckout" disabled>
                        <i class="fas fa-check" aria-hidden="true"></i> Finalizar Venda
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let cart = [];

        // Fallbacks defensivos: um helper ausente não deve interromper todo o script
        if (typeof window.showToast !== 'function') {
            window.showToast = function (message, type) {
                console.log((type || 'info') + ': ' + message);
            };
        }
        if (typeof window.debounce !== 'function') {
            window.debounce = function (fn, delay) {
                let timer;
                return function (...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay || 300);
                };
            };
        }
        
        function formatMZN(value) {
            return new Intl.NumberFormat('pt-MZ', { style: 'currency', currency: 'MZN', minimumFractionDigits: 2 }).format(value);
        }
        
        function parseMZN(str) {
            if (typeof str === 'number') return isFinite(str) ? str : 0;
            if (str == null) return 0;
            let s = String(str).replace(/[^\d.,-]/g, '').trim();
            if (!s) return 0;
            const temVirgula = s.includes(',');
            const temPonto = s.includes('.');
            if (temVirgula && temPonto) {
                // Formato pt-MZ: "1.234,56" -> ponto = milhar, vírgula = decimal
                s = s.replace(/\./g, '').replace(',', '.');
            } else if (temVirgula) {
                // "1234,56" -> vírgula decimal
                s = s.replace(',', '.');
            }
            // Só ponto: "1234.56" já está no formato de máquina (input type=number)
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n;
        }

        function getSubtotal() {
            return cart.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
        }

        function getDesconto() {
            const el = document.getElementById('desconto');
            if (!el) return 0;
            const valor = parseMZN(el.value);
            return valor > 0 ? valor : 0;
        }

        function getTotalFinal() {
            const subtotal = getSubtotal();
            const desconto = Math.min(getDesconto(), subtotal);
            return Math.max(0, subtotal - desconto);
        }

        function onDescontoChange() {
            renderCart();
        }
        
        function addToCart(el) {
            if (el.classList.contains('out-of-stock')) return;
            
            const id = el.dataset.id;
            const nome = el.dataset.nome;
            const preco = parseFloat(el.dataset.preco);
            const stock = parseInt(el.dataset.stock);
            
            const existing = cart.find(item => item.produtoId === id);
            if (existing) {
                if (existing.quantidade < stock) {
                    existing.quantidade++;
                } else {
                    showToast('Stock máximo atingido para ' + nome, 'warning');
                    return;
                }
            } else {
                cart.push({ produtoId: id, nome, preco, quantidade: 1, stock });
            }
            renderCart();
            showToast(nome + ' adicionado ao carrinho', 'success');
        }
        
        function renderCart() {
            const container = document.getElementById('cartItems');
            const emptyMsg = document.getElementById('cartEmpty');
            const totalEl = document.getElementById('totalAmount');
            const btnCheckout = document.getElementById('btnCheckout');
            const itensJson = document.getElementById('itensJson');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="cart-empty" id="cartEmpty"><i class="fas fa-shopping-basket"></i><p>Carrinho vazio</p><p style="font-size: 13px;">Clique num produto para adicionar</p></div>';
                totalEl.textContent = formatMZN(0);
                btnCheckout.disabled = true;
                btnCheckout.innerHTML = '<i class="fas fa-check"></i> Finalizar Venda';
                itensJson.value = '';
                return;
            }
            
            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                const subtotal = item.preco * item.quantidade;
                total += subtotal;
                html += `
                    <div class="cart-item">
                        <div class="info">
                            <div class="name">${item.nome}</div>
                            <div class="price">${formatMZN(item.preco)} x ${item.quantidade}</div>
                        </div>
                        <div class="qty-control">
                            <button onclick="changeQty(${index}, -1)" ${item.quantidade <= 1 ? 'disabled' : ''} aria-label="Diminuir quantidade"><i class="fas fa-minus"></i></button>
                            <span>${item.quantidade}</span>
                            <button onclick="changeQty(${index}, 1)" ${item.quantidade >= item.stock ? 'disabled' : ''} aria-label="Aumentar quantidade"><i class="fas fa-plus"></i></button>
                        </div>
                        <div class="subtotal">${formatMZN(subtotal)}</div>
                        <button class="remove" onclick="removeFromCart(${index})" aria-label="Remover ${item.nome}"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            totalEl.textContent = formatMZN(getTotalFinal());
            itensJson.value = JSON.stringify(cart.map(item => ({ produtoId: item.produtoId, quantidade: item.quantidade })));
            
            const metodo = document.getElementById('metodoPagamento').value;
            if (metodo === 'CASH') {
                calcularTroco();
            } else {
                updateCheckoutButton();
            }
        }
        
        function changeQty(index, delta) {
            cart[index].quantidade += delta;
            if (cart[index].quantidade <= 0) {
                cart.splice(index, 1);
            } else if (cart[index].quantidade > cart[index].stock) {
                cart[index].quantidade = cart[index].stock;
                showToast('Stock máximo atingido!', 'warning');
            }
            renderCart();
        }
        
        function removeFromCart(index) {
            const nome = cart[index].nome;
            cart.splice(index, 1);
            renderCart();
            showToast(nome + ' removido do carrinho', 'info');
        }
        
        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.product-card').forEach(card => {
                const nome = card.dataset.nome.toLowerCase();
                const codigo = card.dataset.codigo?.toLowerCase() || '';
                card.style.display = (nome.includes(search) || codigo.includes(search)) ? '' : 'none';
            });
        }
        
        document.getElementById('metodoPagamento').addEventListener('change', function() {
            const isFiado = this.value === 'FIADO';
            const isCash = this.value === 'CASH';
            
            document.getElementById('fiadoFields').classList.toggle('open', isFiado);
            document.getElementById('trocoField').classList.toggle('hidden', !isCash);
            
            if (!isCash) {
                document.getElementById('valorPago').value = '';
                resetTrocoDisplay();
            } else {
                calcularTroco();
            }
            updateCheckoutButton();
        });
        
        document.getElementById('searchInput').addEventListener('input', debounce(filterProducts, 150));

        // Evita duplo clique/envio duplicado (o token do servidor também protege)
        document.getElementById('checkoutForm').addEventListener('submit', function (e) {
            const btn = document.getElementById('btnCheckout');
            if (cart.length === 0 || btn.disabled) {
                e.preventDefault();
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> A processar...';
        });
        
        function resetTrocoDisplay() {
            const display = document.getElementById('trocoDisplay');
            display.textContent = 'Insira o valor pago';
            display.className = 'troco-display empty';
        }
        
        function setValorPago(valor, btn) {
            const total = parseMZN(document.getElementById('totalAmount').textContent);
            const input = document.getElementById('valorPago');
            const atual = parseMZN(input.value);
            
            if (valor >= total || atual === 0) {
                input.value = valor.toFixed(2);
            } else {
                input.value = (atual + valor).toFixed(2);
            }
            
            document.querySelectorAll('.btn-nota').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            
            calcularTroco();
        }
        
        function setValorExato(btn) {
            const total = parseMZN(document.getElementById('totalAmount').textContent);
            document.getElementById('valorPago').value = total.toFixed(2);
            document.querySelectorAll('.btn-nota').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            calcularTroco();
        }
        
        function calcularTroco() {
            const total = parseMZN(document.getElementById('totalAmount').textContent);
            const valorPago = parseMZN(document.getElementById('valorPago').value);
            const display = document.getElementById('trocoDisplay');
            const btn = document.getElementById('btnCheckout');
            
            if (total <= 0) {
                resetTrocoDisplay();
                updateCheckoutButton();
                return;
            }
            if (valorPago <= 0) {
                resetTrocoDisplay();
                updateCheckoutButton();
                return;
            }
            
            const troco = valorPago - total;
            
            if (troco < -0.01) {
                display.innerHTML = '⚠️ Falta <strong>' + formatMZN(Math.abs(troco)) + '</strong>';
                display.className = 'troco-display insufficient';
                btn.disabled = true;
                btn.innerHTML = '⚠️ Valor insuficiente';
            } else if (Math.abs(troco) < 0.01) {
                display.innerHTML = '✅ Valor exato!';
                display.className = 'troco-display exact';
                updateCheckoutButton();
            } else {
                display.innerHTML = '💰 Troco: <strong>' + formatMZN(troco) + '</strong>';
                display.className = 'troco-display ok';
                updateCheckoutButton();
            }
        }
        
        function updateCheckoutButton() {
            const btn = document.getElementById('btnCheckout');
            const hasItems = cart.length > 0;
            const metodo = document.getElementById('metodoPagamento').value;
            
            if (!hasItems) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-check"></i> Finalizar Venda';
                return;
            }
            
            const subtotal = getSubtotal();
            if (getDesconto() > subtotal + 0.001) {
                btn.disabled = true;
                btn.innerHTML = '⚠️ Desconto inválido';
                return;
            }
            
            if (metodo === 'CASH') {
                const total = parseMZN(document.getElementById('totalAmount').textContent);
                const valorPago = parseMZN(document.getElementById('valorPago').value);
                if (valorPago + 0.01 < total) {
                    btn.disabled = true;
                    btn.innerHTML = '⚠️ Valor insuficiente';
                    return;
                }
            }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Finalizar Venda';
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            
            switch(e.key) {
                case 'F1': case 'f':
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                    break;
                case 'F2':
                    e.preventDefault();
                    if (!document.getElementById('btnCheckout').disabled) {
                        document.getElementById('btnCheckout').click();
                    }
                    break;
                case 'Escape':
                    if (cart.length > 0 && confirm('Limpar carrinho?')) {
                        cart = [];
                        renderCart();
                    }
                    break;
            }
        });
        
        let barcodeBuffer = '';
        let barcodeTimer = null;
        document.addEventListener('keypress', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            
            if (e.key === 'Enter') {
                if (barcodeBuffer.length >= 8) {
                    const searchInput = document.getElementById('searchInput');
                    searchInput.value = barcodeBuffer;
                    filterProducts();
                    
                    const visibleCard = document.querySelector('.product-card:not([style*="display: none"]):not(.out-of-stock)');
                    if (visibleCard) addToCart(visibleCard);
                }
                barcodeBuffer = '';
            } else if (e.key.match(/[\d]/)) {
                barcodeBuffer += e.key;
                clearTimeout(barcodeTimer);
                barcodeTimer = setTimeout(() => { barcodeBuffer = ''; }, 200);
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').focus();
            const metodo = document.getElementById('metodoPagamento').value;
            const isCash = metodo === 'CASH';
            const isFiado = metodo === 'FIADO';
            document.getElementById('fiadoFields').classList.toggle('open', isFiado);
            document.getElementById('trocoField').classList.toggle('hidden', !isCash);
            if (isCash) {
                calcularTroco();
            } else {
                resetTrocoDisplay();
            }
            updateCheckoutButton();
        });
    </script>
</body>
</html>
