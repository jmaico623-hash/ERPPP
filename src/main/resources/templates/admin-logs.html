<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Logs - Admin')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/admin :: sidebar('logs')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/admin :: topbar('Logs de atividade')}"></header>

        <main class="dash-content">
            <div th:replace="~{admin-flash :: flash}"></div>

            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-clipboard-list"></i> Auditoria</span>
                    <h1>Logs de atividade</h1>
                    <p>Últimos 200 registos de auditoria de todos os clientes.</p>
                </div>
            </div>

            <div class="table-responsive">
                <table class="nano-table">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Cliente</th>
                            <th>Ação</th>
                            <th>Tabela</th>
                            <th>Utilizador</th>
                            <th>IP</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="6" class="muted center">Sem registos de atividade.</td>
                        </tr>
                        <tr th:each="log : ${logs}">
                            <td th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm')}">-</td>
                            <td th:text="${clienteNomeMap[log.tenantId]} ?: 'N/A'">-</td>
                            <td><span class="badge badge-info" th:text="${log.acao}">-</span></td>
                            <td th:text="${log.tabelaAfetada} ?: '-'">-</td>
                            <td th:text="${log.usuarioId} ?: '-'">-</td>
                            <td th:text="${log.ipAddress} ?: '-'">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
