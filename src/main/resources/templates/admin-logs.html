<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/theme.css">
    <script defer src="/js/theme.js"></script>
</head>
<body>
    <nav class="navbar navbar-admin">
        <div class="logo"><i class="fas fa-shield-alt"></i> Admin</div>
        <div class="user-info">
            <span th:text="${session.adminNome}"></span>
            <a href="/admin/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </nav>
    <div class="main-container">
        <aside class="sidebar">
            <ul>
                <li><a href="/admin"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="/admin/vendas"><i class="fas fa-shopping-cart"></i> Vendas Globais</a></li>
                <li><a href="/admin/ranking"><i class="fas fa-trophy"></i> Ranking</a></li>
                <li><a href="/admin/financeiro"><i class="fas fa-chart-line"></i> Financeiro</a></li>
                <li><a href="/admin/pagamentos"><i class="fas fa-credit-card"></i> Pagamentos</a></li>
                <li><a href="/admin/config"><i class="fas fa-cog"></i> Config</a></li>
                <li><a href="/admin/cupoes"><i class="fas fa-gift"></i> Cupões</a></li>
                <li class="active"><a href="/admin/logs"><i class="fas fa-clipboard-list"></i> Logs</a></li>
            </ul>
        </aside>
        <main class="content admin-content" style="width:100%;">
            <h1>📋 Logs de Atividade</h1>
            <p style="color:#64748b;margin-bottom:16px;">Últimos 200 registos de auditoria de todos os clientes.</p>

            <table class="nano-table">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Cliente</th>
                        <th>Ação</th>
                        <th>Tabela</th>
                        <th>Utilizador</th>
                        <th>IP</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(logs)}">
                        <td colspan="6" style="text-align:center;">Sem registos de atividade.</td>
                    </tr>
                    <tr th:each="log : ${logs}">
                        <td th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm')}">-</td>
                        <td th:text="${clienteNomeMap[log.tenantId]} ?: 'N/A'">-</td>
                        <td><span class="badge badge-info" th:text="${log.acao}">-</span></td>
                        <td th:text="${log.tabelaAfetada} ?: '-'">-</td>
                        <td th:text="${log.usuarioId} ?: '-'">-</td>
                        <td th:text="${log.ipAddress} ?: '-'">-</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
</body>
</html>
