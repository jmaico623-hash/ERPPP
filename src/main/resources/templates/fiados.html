<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Fiados - NanoBanana ERP')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/shell :: sidebar('fiados')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/shell :: topbar('Fiados')}"></header>

        <main class="dash-content">
            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-book-open"></i> Financeiro</span>
                    <h1>Caderno de fiado</h1>
                    <p>Gestão de vendas fiadas e cobranças.</p>
                </div>
                <div class="dash-actions">
                    <a href="/export/fiados.csv" class="btn-dash ghost"><i class="fas fa-file-csv"></i> Exportar CSV</a>
                </div>
            </div>

            <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

            <div class="kpi-grid">
                <div class="kpi warning">
                    <span class="label">Total fiado não pago</span>
                    <span class="value" th:text="${totalFiado + ' MZN'}">0 MZN</span>
                </div>
                <div class="kpi">
                    <span class="label">Fiados pendentes</span>
                    <span class="value" th:text="${fiadosNaoPagos}">0</span>
                </div>
            </div>

            <div class="card">
                <h2><i class="fas fa-list"></i> Todos os fiados</h2>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Valor</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="fiado : ${fiados}">
                                <td>
                                    <strong th:text="${fiado.nomeCliente}">Cliente</strong>
                                    <div class="muted" th:if="${fiado.telefoneCliente}" th:text="${fiado.telefoneCliente}"></div>
                                </td>
                                <td><strong th:text="${fiado.valor + ' MZN'}">0 MZN</strong></td>
                                <td th:text="${#temporals.format(fiado.dataCriacao, 'dd/MM/yyyy HH:mm')}">-</td>
                                <td>
                                    <span th:if="${fiado.pago}" class="badge badge-success"><i class="fas fa-check"></i> Pago</span>
                                    <span th:if="${!fiado.pago}" class="badge badge-warning"><i class="fas fa-clock"></i> Pendente</span>
                                </td>
                                <td>
                                    <form th:if="${!fiado.pago}" th:action="@{'/fiados/' + ${fiado.id} + '/pagar'}" method="POST" class="mb-0">
                                        <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-check"></i> Marcar como pago</button>
                                    </form>
                                    <span th:if="${fiado.pago}" class="muted">
                                        Pago em <span th:text="${#temporals.format(fiado.dataPagamento, 'dd/MM/yyyy')}"></span>
                                    </span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(fiados)}">
                                <td colspan="5" class="muted center" style="padding: 40px;">Nenhum fiado registado</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="nb-pagination" th:if="${pagina != null and pagina.totalPages > 1}">
                    <a th:if="${pagina.hasPrevious()}" th:href="@{/fiados(page=${pagina.number - 1})}">‹ Anterior</a>
                    <span th:unless="${pagina.hasPrevious()}" class="disabled">‹ Anterior</span>
                    <span class="current" th:text="${pagina.number + 1} + ' / ' + ${pagina.totalPages}">1 / 1</span>
                    <a th:if="${pagina.hasNext()}" th:href="@{/fiados(page=${pagina.number + 1})}">Próxima ›</a>
                    <span th:unless="${pagina.hasNext()}" class="disabled">Próxima ›</span>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
