<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Histórico de vendas - NanoBanana ERP')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/shell :: sidebar('historico')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/shell :: topbar('Histórico de vendas')}"></header>

        <main class="dash-content">
            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-history"></i> Vendas</span>
                    <h1>Histórico de vendas</h1>
                    <p th:if="${isVendedor}">Apenas as suas vendas.</p>
                    <p th:if="${!isVendedor}">Todas as vendas da loja.</p>
                </div>
                <div class="dash-actions">
                    <a href="/export/vendas.csv" class="btn-dash ghost"><i class="fas fa-file-csv"></i> Exportar CSV</a>
                    <a href="/pdv" class="btn-dash primary"><i class="fas fa-cash-register"></i> Abrir PDV</a>
                </div>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Vendedor</th>
                                <th>Total</th>
                                <th>Pagamento</th>
                                <th>Status</th>
                                <th>Data/Hora</th>
                                <th>Recibo</th>
                                <th th:if="${isDono || isGerente}">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="venda : ${vendas}">
                                <td th:text="${venda.id.toString().substring(0, 8)}">-</td>
                                <td th:text="${venda.vendedorId}">-</td>
                                <td th:text="${venda.total + ' MZN'}">0 MZN</td>
                                <td><span class="badge badge-info" th:text="${venda.metodoPagamento}">-</span></td>
                                <td>
                                    <span th:if="${venda.status.name() == 'CONCLUIDA'}" class="badge badge-success">Concluída</span>
                                    <span th:if="${venda.status.name() == 'CANCELADA'}" class="badge badge-danger">Cancelada</span>
                                </td>
                                <td th:text="${#temporals.format(venda.dataHora, 'dd/MM/yyyy HH:mm')}">-</td>
                                <td><a th:href="@{'/pdv/recibo/' + ${venda.id}}" class="badge badge-info"><i class="fas fa-receipt"></i> Ver</a></td>
                                <td th:if="${isDono || isGerente}">
                                    <a th:if="${venda.status.name() == 'CONCLUIDA'}" th:href="@{'/pdv/devolucao/' + ${venda.id}}" class="badge badge-warning"><i class="fas fa-undo"></i> Devolver</a>
                                    <span th:unless="${venda.status.name() == 'CONCLUIDA'}" class="muted">—</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(vendas)}">
                                <td th:attr="colspan=${(isDono || isGerente) ? 8 : 7}" class="muted center" style="padding: 40px;">Nenhuma venda encontrada</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="nb-pagination" th:if="${pagina != null and pagina.totalPages > 1}">
                    <a th:if="${pagina.hasPrevious()}" th:href="@{/pdv/historico(page=${pagina.number - 1})}">‹ Anterior</a>
                    <span th:unless="${pagina.hasPrevious()}" class="disabled">‹ Anterior</span>
                    <span class="current" th:text="${pagina.number + 1} + ' / ' + ${pagina.totalPages}">1 / 1</span>
                    <a th:if="${pagina.hasNext()}" th:href="@{/pdv/historico(page=${pagina.number + 1})}">Próxima ›</a>
                    <span th:unless="${pagina.hasNext()}" class="disabled">Próxima ›</span>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
