<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Ranking - Admin')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/admin :: sidebar('ranking')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/admin :: topbar('Ranking de lojas')}"></header>

        <main class="dash-content">
            <div th:replace="~{admin-flash :: flash}"></div>

            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-trophy"></i> Desempenho</span>
                    <h1>Ranking de lojas</h1>
                    <p>Vendas por loja no mês atual.</p>
                </div>
            </div>

            <div class="table-responsive">
                <table class="nano-table">
                    <thead>
                        <tr><th>#</th><th>Loja</th><th>Responsável</th><th>Vendas (mês)</th><th>Qtd. vendas</th><th>Fiado pendente</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="r, iterStat : ${ranking}" th:classappend="${iterStat.index < 3} ? 'top3'">
                            <td>
                                <span th:if="${iterStat.index == 0}"><i class="fas fa-medal icon-warn"></i></span>
                                <span th:if="${iterStat.index == 1}"><i class="fas fa-medal icon-warn"></i></span>
                                <span th:if="${iterStat.index == 2}"><i class="fas fa-medal icon-warn"></i></span>
                                <span th:if="${iterStat.index > 2}" th:text="${iterStat.count}"></span>
                            </td>
                            <td class="cell-link" th:text="${r.cliente.nomeNegocio}"></td>
                            <td th:text="${r.cliente.nome}"></td>
                            <td class="text-success" style="font-weight:700;" th:text="${#numbers.formatDecimal(r.vendasMes, 1, 2)} + ' MZN'"></td>
                            <td th:text="${r.qtdVendas}"></td>
                            <td>
                                <span th:if="${r.totalFiado > 0}" class="text-danger" style="font-weight:600;" th:text="${#numbers.formatDecimal(r.totalFiado, 1, 2)} + ' MZN'"></span>
                                <span th:unless="${r.totalFiado > 0}" class="muted">0 MZN</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
