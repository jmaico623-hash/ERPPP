<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Página não encontrada - NanoBanana ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/error.css">
    <link rel="stylesheet" href="/css/theme.css">
    <script defer src="/js/theme.js"></script>
</head>
<body class="error-body">
    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-icon"><i class="fas fa-compass"></i></div>
        <h1>Página não encontrada</h1>
        <p>O endereço <code th:text="${path}">/exemplo</code> não existe ou foi movido.</p>
        <div class="error-actions">
            <a href="/dashboard" class="error-btn"><i class="fas fa-house"></i> Voltar ao painel</a>
        </div>
    </div>
</body>
</html>
