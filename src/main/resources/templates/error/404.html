<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - NanoBanana ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 48px; max-width: 480px; width: 100%; text-align: center; }
        .code { font-size: 72px; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #27ae60, #2ecc71); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
        .icon { width: 72px; height: 72px; background: #e8f8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .icon i { font-size: 30px; color: #27ae60; }
        h1 { color: #333; font-size: 24px; margin-bottom: 12px; }
        p { color: #666; font-size: 16px; line-height: 1.5; margin-bottom: 12px; }
        code { background: #f1f5f9; padding: 2px 8px; border-radius: 4px; font-size: 13px; color: #475569; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: transform 0.2s; margin-top: 12px; }
        .btn:hover { transform: translateY(-2px); }
    </style>
    <link rel="stylesheet" href="/css/theme.css">
    <script defer src="/js/theme.js"></script>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="icon"><i class="fas fa-compass"></i></div>
        <h1>Página não encontrada</h1>
        <p>O endereço <code th:text="${path}">/exemplo</code> não existe ou foi movido.</p>
        <a href="/dashboard" class="btn"><i class="fas fa-house"></i> Voltar ao Dashboard</a>
    </div>
</body>
</html>
