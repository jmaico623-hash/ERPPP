<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado - NanoBanana ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 48px; max-width: 480px; width: 100%; text-align: center; }
        .icon { width: 80px; height: 80px; background: #fee; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .icon i { font-size: 36px; color: #e74c3c; }
        h1 { color: #333; font-size: 24px; margin-bottom: 12px; }
        p { color: #666; font-size: 16px; line-height: 1.5; margin-bottom: 24px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .btn-secondary { background: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"><i class="fas fa-lock"></i></div>
        <h1>Acesso Negado</h1>
        <p th:text="${message}">Você não tem permissão para acessar esta página.</p>
        <p style="font-size: 14px; color: #999; margin-bottom: 24px;">Verifique se você tem a função necessária (DONO, GERENTE ou VENDEDOR).</p>
        <a href="/pdv" class="btn"><i class="fas fa-cash-register"></i> Ir para PDV</a>
        <a href="/dashboard" class="btn btn-secondary" style="margin-left: 12px;"><i class="fas fa-chart-line"></i> Dashboard</a>
    </div>
</body>
</html>
