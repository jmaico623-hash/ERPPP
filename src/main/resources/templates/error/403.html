<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Acesso negado - NanoBanana ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/error.css">
    <link rel="stylesheet" href="/css/theme.css">
    <script defer src="/js/theme.js"></script>
</head>
<body class="error-body">
    <div class="error-card">
        <div class="error-icon danger"><i class="fas fa-lock"></i></div>
        <h1>Acesso negado</h1>
        <p th:text="${message}">Não tem permissão para acessar esta página.</p>
        <p class="hint">Verifique se o seu perfil tem a permissão necessária (DONO, GERENTE ou VENDEDOR).</p>
        <div class="error-actions">
            <a href="/pdv" class="error-btn"><i class="fas fa-cash-register"></i> Ir para o PDV</a>
            <a href="/dashboard" class="error-btn secondary"><i class="fas fa-chart-line"></i> Painel</a>
        </div>
    </div>
</body>
</html>
