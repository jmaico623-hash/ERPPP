<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Configurações - Admin')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/admin :: sidebar('config')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/admin :: topbar('Configuração')}"></header>

        <main class="dash-content">
            <div th:replace="~{admin-flash :: flash}"></div>

            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-gear"></i> Sistema</span>
                    <h1>Configuração</h1>
                    <p>Parâmetros globais da plataforma.</p>
                </div>
            </div>

            <div class="assinatura-card">
                <h2><i class="fas fa-coins"></i> Preço da assinatura mensal</h2>
                <table class="info-table">
                    <tr>
                        <td><strong>Preço atual</strong></td>
                        <td><span class="text-success" th:text="${precoAtual} + ' MZN'" style="font-weight:700;">350.00 MZN</span></td>
                    </tr>
                </table>
                <p class="muted" style="margin-top:12px;">
                    O preço é definido no servidor pela variável <code>APP_SUBSCRIPTION_PRICE</code> e só entra em vigor
                    após reiniciar a aplicação. Para descontos pontuais a clientes específicos, use a página de cupões.
                </p>
            </div>
        </main>
    </div>
</div>
</body>
</html>
