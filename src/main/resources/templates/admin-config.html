<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/theme.css">
    <script defer src="/js/theme.js"></script>
</head>
<body>
    <nav class="navbar navbar-admin">
        <div class="logo"><i class="fas fa-shield-alt"></i> Admin</div>
        <div class="user-info"><span th:text="${session.adminNome}"></span><a href="/admin/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i></a></div>
    </nav>
    <div class="main-container">
        <aside class="sidebar">
            <ul>
                <li><a href="/admin"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="/admin/vendas"><i class="fas fa-shopping-cart"></i> Vendas Globais</a></li>
                <li><a href="/admin/ranking"><i class="fas fa-trophy"></i> Ranking</a></li>
                <li><a href="/admin/financeiro"><i class="fas fa-chart-line"></i> Financeiro</a></li>
                <li><a href="/admin/pagamentos"><i class="fas fa-credit-card"></i> Pagamentos</a></li>
                <li class="active"><a href="/admin/config"><i class="fas fa-cog"></i> Config</a></li>
                <li><a href="/admin/cupoes"><i class="fas fa-gift"></i> Cupões</a></li>
                <li><a href="/admin/logs"><i class="fas fa-clipboard-list"></i> Logs</a></li>
            </ul>
        </aside>
        <main class="content admin-content" style="width:100%;">
            <h1>⚙️ Configurações</h1>
            <div class="assinatura-card">
                <h2>💰 Preço da Assinatura Mensal</h2>
                <p style="color:#7f8c8d;margin-bottom:16px;">Preço atual: <strong th:text="${precoAtual} + ' MZN'">350.0 MZN</strong></p>
                <form th:action="@{/admin/config/preco}" method="post" class="inline-form">
                    <input type="number" name="preco" placeholder="Novo preço" step="0.01" min="0" required>
                    <button type="submit" class="btn-success"><i class="fas fa-save"></i> Atualizar Preço</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
