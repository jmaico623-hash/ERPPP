<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Stock rápido - NanoBanana ERP')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/shell :: sidebar('stock')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/shell :: topbar('Stock rápido')}"></header>

        <main class="dash-content">
            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-boxes-stacked"></i> Operação</span>
                    <h1>Gestão rápida de stock</h1>
                    <p>Produtos sem stock aparecem primeiro. Use + ou − para ajustar quantidades.</p>
                </div>
                <div class="dash-actions">
                    <a href="/stock/gestao" class="btn-dash ghost"><i class="fas fa-list-check"></i> Gestão completa</a>
                </div>
            </div>

            <div class="stock-grid">
                <div class="stock-card" th:each="p : ${produtos}" th:classappend="${p.stock == 0} ? ' sem-stock' : ' com-stock'">
                    <div class="stock-icon">
                        <i class="fas" th:classappend="${p.stock == 0} ? ' fa-circle-xmark' : (${p.stock <= 5} ? ' fa-triangle-exclamation' : ' fa-circle-check')"></i>
                    </div>
                    <div class="stock-name" th:text="${p.nome}"></div>
                    <div class="stock-count" th:classappend="${p.stock == 0} ? ' zero' : ' ok'" th:text="${p.stock}"></div>

                    <div class="stock-controls">
                        <form th:action="@{/stock/ajustar}" method="post" class="adjust-form">
                            <input type="hidden" name="produtoId" th:value="${p.id}">
                            <button type="submit" class="stock-btn minus" name="qtd" value="-5">−5</button>
                            <button type="submit" class="stock-btn minus" name="qtd" value="-1">−1</button>
                        </form>
                        <form th:action="@{/stock/ajustar}" method="post" class="adjust-form adjust-custom">
                            <input type="hidden" name="produtoId" th:value="${p.id}">
                            <input type="number" name="qtd" value="10" min="1" class="stock-qtd-input" aria-label="Quantidade a adicionar">
                            <button type="submit" class="stock-btn plus">+</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(produtos)}">
                <i class="fas fa-box-open"></i>
                <strong>Sem produtos</strong>
                Registe produtos no inventário para gerir o stock.
            </div>
        </main>
    </div>
</div>
</body>
</html>
