<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Rápido - NanoBanana</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .stock-card { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.2s; }
        .stock-card.sem-stock { border: 2px solid #E74C3C; background: #FDEDEC; }
        .stock-card.com-stock { border: 2px solid #2ECC71; }
        .stock-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .stock-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        .stock-count { font-size: 1.8rem; font-weight: 800; margin: 8px 0; }
        .stock-count.zero { color: #E74C3C; }
        .stock-count.ok { color: #2ECC71; }
        .stock-controls { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
        .stock-btn { width: 40px; height: 40px; border: none; border-radius: 50%; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .stock-btn.minus { background: #FDEDEC; color: #E74C3C; }
        .stock-btn.minus:hover { background: #E74C3C; color: white; }
        .stock-btn.plus { background: #EAFAF1; color: #2ECC71; }
        .stock-btn.plus:hover { background: #2ECC71; color: white; }
        .stock-qtd-input { width: 50px; text-align: center; font-size: 1rem; font-weight: 600; border: 2px solid #e8e8e8; border-radius: 8px; padding: 6px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-leaf"></i> NanoBanana ERP</div>
        <div class="user-info">
            <span class="badge-plano" th:text="${session.plano}"></span>
            <span class="merchant-name" th:text="${session.clienteNegocio}"></span>
            <a href="/dashboard" class="btn-logout"><i class="fas fa-arrow-left"></i></a>
        </div>
    </nav>
    <div class="main-container">
        <aside class="sidebar">
            <ul>
                <li><a href="/dashboard"><i class="fas fa-home"></i> Painel</a></li>
                <li><a href="/vendas"><i class="fas fa-cart-plus"></i> Vender (PDV)</a></li>
                <li><a href="/fiados"><i class="fas fa-book-open"></i> Fiado</a></li>
                <li class="active"><a href="/stock"><i class="fas fa-boxes"></i> Stock Rápido</a></li>
                <li><a href="/inventario"><i class="fas fa-clipboard-list"></i> Inventário</a></li>
                <li><a href="/estagnados"><i class="fas fa-hourglass-end"></i> Estagnados</a></li>
                <li><a href="/assinatura"><i class="fas fa-id-card"></i> Assinatura</a></li>
            </ul>
        </aside>
        <main class="content">
            <h1>📦 Gestão Rápida de Stock</h1>
            <p class="subtitle">Produtos sem stock aparecem primeiro. Clica + ou - para ajustar.</p>

            <div class="stock-grid">
                <div class="stock-card" th:each="p : ${produtos}" th:classappend="${p.stock == 0} ? ' sem-stock' : ' com-stock'">
                    <div class="stock-icon" th:if="${p.stock == 0}">🚫</div>
                    <div class="stock-icon" th:if="${p.stock > 0 and p.stock <= 5}">⚠️</div>
                    <div class="stock-icon" th:if="${p.stock > 5}">✅</div>
                    <div class="stock-name" th:text="${p.nome}"></div>
                    <div class="stock-count" th:classappend="${p.stock == 0} ? ' zero' : ' ok'" th:text="${p.stock}"></div>
                    <form th:action="@{/stock/ajustar}" method="post" class="stock-controls">
                        <input type="hidden" name="produtoId" th:value="${p.id}">
                        <button type="submit" class="stock-btn minus" name="qtd" value="-5">-5</button>
                        <button type="submit" class="stock-btn minus" name="qtd" value="-1">-1</button>
                        <input type="number" name="qtd" value="10" min="1" class="stock-qtd-input">
                        <button type="submit" class="stock-btn plus">+ Adicionar</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
