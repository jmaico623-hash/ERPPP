<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Despesas - NanoBanana ERP')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/shell :: sidebar('despesas')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/shell :: topbar('Despesas')}"></header>

        <main class="dash-content">
            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-receipt"></i> Financeiro</span>
                    <h1>Despesas</h1>
                    <p>Registo e acompanhamento das despesas da loja.</p>
                </div>
            </div>

            <div class="card-grid sidebar-left">
                <div class="card">
                    <h2><i class="fas fa-plus-circle"></i> Registar despesa</h2>

                    <div class="kpi warning mb-16">
                        <span class="label">Total de despesas (mês atual)</span>
                        <span class="value" th:text="${#numbers.formatDecimal(totalMes != null ? totalMes : 0, 1, 'COMMA', 2, 'POINT')} + ' MZN'">0,00 MZN</span>
                    </div>

                    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
                    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

                    <form method="post" action="/despesas">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <div class="form-row">
                            <label>Descrição</label>
                            <input type="text" name="descricao" required maxlength="255" placeholder="Ex: Renda da loja, Energia EDM...">
                        </div>
                        <div class="form-row">
                            <label>Categoria</label>
                            <select name="categoria" required>
                                <option th:each="c : ${categorias}" th:value="${c.name()}" th:text="${c.name()}">OUTROS</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>Valor (MZN)</label>
                            <input type="number" step="0.01" min="0.01" name="valor" required>
                        </div>
                        <div class="form-row">
                            <label>Data</label>
                            <input type="date" name="dataDespesa" th:value="${hoje}">
                        </div>
                        <div class="form-row">
                            <label>Método de pagamento</label>
                            <select name="metodoPagamento">
                                <option value="">—</option>
                                <option value="CASH">Dinheiro</option>
                                <option value="MPESA">M-Pesa</option>
                                <option value="EMOLA">e-Mola</option>
                                <option value="TRANSFERENCIA">Transferência</option>
                                <option value="CARTAO">Cartão</option>
                                <option value="OUTRO">Outro</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>Observação</label>
                            <textarea name="observacao" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Registar despesa</button>
                    </form>
                </div>

                <div class="card">
                    <h2><i class="fas fa-list"></i> Despesas recentes</h2>
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Método</th><th>Valor</th></tr></thead>
                            <tbody>
                                <tr th:each="d : ${despesas}">
                                    <td th:text="${#temporals.format(d.dataDespesa, 'dd/MM/yyyy')}">-</td>
                                    <td th:text="${d.descricao}">-</td>
                                    <td th:text="${d.categoria}">-</td>
                                    <td th:text="${d.metodoPagamento}">-</td>
                                    <td th:text="${#numbers.formatDecimal(d.valor, 1, 'COMMA', 2, 'POINT')} + ' MZN'">-</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(despesas)}"><td colspan="5" class="muted center">Sem despesas registadas</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
