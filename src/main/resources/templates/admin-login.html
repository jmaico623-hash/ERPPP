<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - NanoBanana ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body" style="background: linear-gradient(135deg, #2c3e50, #34495e);">
    <div class="auth-container">
        <div class="auth-logo">
            <i class="fas fa-shield-alt" style="color: #2c3e50;"></i>
            <h1>Admin Painel</h1>
            <p>NanoBanana ERP - Gestão Central</p>
        </div>

        <div th:if="${param.erro}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> Credenciais inválidas!
        </div>

        <form action="/admin/login" method="post" class="auth-form">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Admin</label>
                <input type="email" name="email" placeholder="admin@nanobanana.co.mz" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Senha</label>
                <input type="password" name="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-primary" style="background: #2c3e50;"><i class="fas fa-sign-in-alt"></i> Entrar no Painel</button>
        </form>

        <div class="admin-link" style="margin-top:20px;">
            <a href="/login" style="color: #2ECC71;"><i class="fas fa-arrow-left"></i> Voltar ao ERP</a>
        </div>
    </div>
</body>
</html>
