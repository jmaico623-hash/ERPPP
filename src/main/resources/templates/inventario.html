<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Inventário - NanoBanana ERP')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/shell :: sidebar('inventario')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/shell :: topbar('Inventário')}"></header>

        <main class="dash-content">
            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-clipboard-list"></i> Operação</span>
                    <h1>Inventário</h1>
                    <p>Produtos, preços, stock e valor em armazém.</p>
                </div>
                <div class="dash-actions">
                    <a href="/stock/gestao" class="btn-dash primary"><i class="fas fa-boxes-stacked"></i> Gestão de stock</a>
                </div>
            </div>

            <div class="card">
                <h2><i class="fas fa-plus-circle"></i> Adicionar produto</h2>
                <form action="/inventario/adicionar" method="post" class="form-grid">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <div class="form-row span-2">
                        <label>Nome do produto</label>
                        <input type="text" name="nome" placeholder="Nome do produto" required>
                    </div>
                    <div class="form-row">
                        <label>Preço (MZN)</label>
                        <input type="number" name="preco" placeholder="0.00" step="0.01" required>
                    </div>
                    <div class="form-row">
                        <label>Stock inicial</label>
                        <input type="number" name="stock" placeholder="0" min="0" required>
                    </div>
                    <div class="form-row">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Adicionar</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2><i class="fas fa-boxes-stacked"></i> Produtos registados</h2>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Produto</th><th>Preço</th><th>Stock</th><th>Valor total</th><th>Estagnado?</th><th>Ações</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(produtos)}">
                                <td colspan="7" class="muted center">Nenhum produto. Adicione acima.</td>
                            </tr>
                            <tr th:each="p : ${produtos}" th:classappend="${p.estaEstagnado()} ? 'estagnado' : ''">
                                <td th:text="${p.id}"></td>
                                <td th:text="${p.nome}"></td>
                                <td th:text="${p.preco} + ' MZN'"></td>
                                <td th:text="${p.stock}"></td>
                                <td th:text="${p.valorStock} + ' MZN'"></td>
                                <td>
                                    <span th:if="${p.estaEstagnado()}" class="badge badge-danger"><i class="fas fa-triangle-exclamation"></i> Sim</span>
                                    <span th:unless="${p.estaEstagnado()}" class="badge badge-success"><i class="fas fa-check"></i> Não</span>
                                </td>
                                <td>
                                    <form th:action="@{/inventario/{id}/reabastecer(id=${p.id})}" method="post" class="form-inline">
                                        <input type="number" name="qtd" min="1" value="10" style="width:70px;">
                                        <button type="submit" class="btn btn-sm btn-secondary"><i class="fas fa-plus"></i> Repor</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
