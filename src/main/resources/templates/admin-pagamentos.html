<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Pagamentos - Admin')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/admin :: sidebar('pagamentos')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/admin :: topbar('Pagamentos')}"></header>

        <main class="dash-content">
            <div th:replace="~{admin-flash :: flash}"></div>

            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-credit-card"></i> Financeiro</span>
                    <h1>Histórico de pagamentos</h1>
                    <p>Todos os pedidos de renovação registados.</p>
                </div>
            </div>

            <div class="table-responsive">
                <table class="nano-table">
                    <thead>
                        <tr><th>ID</th><th>Cliente</th><th>Valor</th><th>Método</th><th>Referência</th><th>Data</th><th>Estado</th></tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(pagamentos)}"><td colspan="7" class="muted center">Sem pagamentos registados.</td></tr>
                        <tr th:each="p : ${pagamentos}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${clienteNomeMap[p.clienteId]} ?: 'N/A'"></td>
                            <td th:text="${p.valor} + ' MZN'"></td>
                            <td th:text="${p.metodo}"></td>
                            <td th:text="${p.referencia}"></td>
                            <td th:text="${p.data}"></td>
                            <td>
                                <span th:if="${p.confirmado}" class="badge badge-success">Confirmado</span>
                                <span th:unless="${p.confirmado}" class="badge badge-warning">Pendente</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
