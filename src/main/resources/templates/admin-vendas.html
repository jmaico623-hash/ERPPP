<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Vendas globais - Admin')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/admin :: sidebar('vendas')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/admin :: topbar('Vendas globais')}"></header>

        <main class="dash-content">
            <div th:replace="~{admin-flash :: flash}"></div>

            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-cart-shopping"></i> Vendas</span>
                    <h1>Vendas globais</h1>
                    <p>Vendas de todas as lojas, por período.</p>
                </div>
            </div>

            <div class="periodo-filtro">
                <a th:href="@{/admin/vendas(periodo='hoje')}" th:classappend="${periodo == 'hoje' or periodo == null} ? 'active'" class="btn-periodo">Hoje</a>
                <a th:href="@{/admin/vendas(periodo='semana')}" th:classappend="${periodo == 'semana'} ? 'active'" class="btn-periodo">Semana</a>
                <a th:href="@{/admin/vendas(periodo='mes')}" th:classappend="${periodo == 'mes'} ? 'active'" class="btn-periodo">Mês</a>
                <a th:href="@{/admin/vendas(periodo='todas')}" th:classappend="${periodo == 'todas'} ? 'active'" class="btn-periodo">Todas</a>
            </div>

            <div class="total-vendas-header">
                <span th:text="${periodoLabel}">Período</span>
                <span class="total-valor" th:text="${#numbers.formatDecimal(totalGeral, 1, 2)} + ' MZN'">0 MZN</span>
            </div>

            <div class="table-responsive">
                <table class="nano-table">
                    <thead>
                        <tr><th>ID</th><th>Loja</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Pagamento</th><th>Fiado</th><th>Troco</th></tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(todasVendas)}"><td colspan="8" class="muted center">Sem vendas neste período.</td></tr>
                        <tr th:each="item : ${todasVendas}">
                            <td th:text="${item.venda.id}"></td>
                            <td th:text="${item.clienteNegocio}"></td>
                            <td th:text="${item.clienteNome}"></td>
                            <td th:text="${item.venda.data}"></td>
                            <td th:text="${#numbers.formatDecimal(item.venda.valor, 1, 2)} + ' MZN'"></td>
                            <td th:text="${item.venda.formaPagamento}"></td>
                            <td>
                                <span th:if="${item.venda.fiado}" class="badge badge-warning">Sim</span>
                                <span th:unless="${item.venda.fiado}" class="badge badge-success">Não</span>
                            </td>
                            <td th:text="${item.venda.troco != null ? #numbers.formatDecimal(item.venda.troco, 1, 2) + ' MZN' : '-'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
