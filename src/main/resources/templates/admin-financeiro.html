<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Financeiro - Admin')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/admin :: sidebar('financeiro')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/admin :: topbar('Relatório financeiro')}"></header>

        <main class="dash-content">
            <div th:replace="~{admin-flash :: flash}"></div>

            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-chart-line"></i> Financeiro</span>
                    <h1>Relatório financeiro</h1>
                    <p>Receita de assinaturas nos últimos 12 meses.</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3><i class="fas fa-coins"></i> Receita 12 meses</h3>
                    <p class="stat-value" th:text="${#numbers.formatDecimal(receitaTotal, 1, 2)} + ' MZN'">0 MZN</p>
                </div>
                <div class="stat-card">
                    <h3><i class="fas fa-chart-bar"></i> Média mensal</h3>
                    <p class="stat-value" th:text="${#numbers.formatDecimal(mediaMensal, 1, 2)} + ' MZN'">0 MZN</p>
                </div>
            </div>

            <h2 class="section-title"><i class="fas fa-calendar"></i> Receita mensal</h2>
            <div class="table-responsive">
                <table class="nano-table">
                    <thead><tr><th>Mês</th><th>Receita</th></tr></thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(receitaMensal)}"><td colspan="2" class="muted center">Sem dados.</td></tr>
                        <tr th:each="entry : ${receitaMensal}">
                            <td th:text="${entry.key}"></td>
                            <td class="text-success" style="font-weight:600;" th:text="${#numbers.formatDecimal(entry.value, 1, 2)} + ' MZN'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
