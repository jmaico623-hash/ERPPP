<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Produtos estagnados - NanoBanana ERP')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/shell :: sidebar('estagnados')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/shell :: topbar('Produtos estagnados')}"></header>

        <main class="dash-content">
            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-hourglass-half"></i> Operação</span>
                    <h1>Dinheiro adormecido</h1>
                    <p>Produtos sem venda há mais de 30 dias.</p>
                </div>
            </div>

            <div class="kpi-grid" th:if="${!#lists.isEmpty(estagnados)}">
                <div class="kpi danger">
                    <span class="label">Total de dinheiro parado</span>
                    <span class="value" th:text="${totalParado} + ' MZN'">0 MZN</span>
                </div>
                <div class="kpi">
                    <span class="label">Produtos estagnados</span>
                    <span class="value" th:text="${#lists.size(estagnados)}">0</span>
                </div>
            </div>

            <div class="card">
                <h2><i class="fas fa-hourglass-half"></i> Produtos sem venda</h2>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>Produto</th><th>Última venda</th><th>Dias sem venda</th><th>Valor parado</th><th>Sugestão</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(estagnados)}">
                                <td colspan="5" class="muted center">Nenhum produto estagnado. Todos estão a vender bem.</td>
                            </tr>
                            <tr th:each="p : ${estagnados}">
                                <td th:text="${p.nome}"></td>
                                <td th:text="${p.ultimaVenda != null ? p.ultimaVenda : 'Nunca'}"></td>
                                <td th:text="${(p.diasSemVenda() > 365 ? '365+' : p.diasSemVenda())} + ' dias'"></td>
                                <td th:text="${p.valorStock} + ' MZN'"></td>
                                <td><span class="badge badge-warning"><i class="fas fa-tag"></i> Fazer promoção</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
