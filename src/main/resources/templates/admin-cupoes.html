<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Cupões - Admin')}"></head>
<body class="dash-body">
<div class="dash-shell">
    <aside th:replace="~{fragments/admin :: sidebar('cupoes')}"></aside>

    <div class="dash-main">
        <header th:replace="~{fragments/admin :: topbar('Cupões de desconto')}"></header>

        <main class="dash-content">
            <div th:replace="~{admin-flash :: flash}"></div>

            <div class="dash-header">
                <div>
                    <span class="eyebrow"><i class="fas fa-gift"></i> Financeiro</span>
                    <h1>Cupões de desconto</h1>
                    <p>Códigos promocionais para renovação de assinaturas.</p>
                </div>
            </div>

            <div class="assinatura-card">
                <h2><i class="fas fa-plus"></i> Criar novo cupão</h2>
                <form th:action="@{/admin/cupao/criar}" method="post" class="inline-form">
                    <input type="text" name="codigo" placeholder="Código (ex: PROMO10)" required
                           pattern="[A-Za-z0-9_-]{3,50}" title="3–50 caracteres: letras, números, '-' ou '_'">
                    <input type="number" name="descontoPercent" placeholder="% desconto" min="0.01" max="100" step="0.01" required>
                    <select name="clienteId">
                        <option value="">Todos os clientes</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nomeNegocio}"></option>
                    </select>
                    <button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> Criar cupão</button>
                </form>
            </div>

            <h2 class="section-title"><i class="fas fa-list"></i> Cupões criados</h2>
            <div class="table-responsive">
                <table class="nano-table">
                    <thead><tr><th>Código</th><th>Desconto</th><th>Cliente</th><th>Estado</th><th>Criado em</th></tr></thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(cupoms)}"><td colspan="5" class="muted center">Nenhum cupão criado.</td></tr>
                        <tr th:each="c : ${cupoms}">
                            <td th:text="${c.codigo}"></td>
                            <td th:text="${c.descontoPercent} + '%'"></td>
                            <td th:text="${c.tenantId} ?: 'Todos os clientes'"></td>
                            <td>
                                <span th:if="${c.ativo}" class="badge badge-success">Ativo</span>
                                <span th:unless="${c.ativo}" class="badge badge-danger">Inativo</span>
                            </td>
                            <td th:text="${#temporals.format(c.criadoEm, 'dd/MM/yyyy HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="muted">Nota: os cupões são registados mas ainda não são aplicados automaticamente nas vendas.</p>
        </main>
    </div>
</div>
</body>
</html>
