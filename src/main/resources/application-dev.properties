# ============================================================
# Perfil DEV - H2 persistente em arquivo, dados demo habilitados
# ============================================================

spring.datasource.url=jdbc:h2:file:./data/nanobanana;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway controla o schema; Hibernate apenas valida/usa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Console H2 em dev: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seed de demonstração
app.seed.enabled=true
app.admin.password=${ADMIN_PASSWORD:admin123}

# Logs mais detalhados em dev
logging.level.com.nanobanana=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO

# Sem cache de templates para facilitar o desenvolvimento
spring.thymeleaf.cache=false
